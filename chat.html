<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Rasa Chatbot | Bootstrap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <style>
      body {
        background: #f7f9fc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .chat-container {
        width: 400px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        overflow: hidden;
      }
      .chat-header {
        background: #0d6efd;
        color: white;
        padding: 15px;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
      }
      .chat-body {
        height: 400px;
        overflow-y: auto;
        padding: 15px;
        background: #f8f9fa;
      }
      .chat-message {
        margin-bottom: 12px;
      }
      .bot-message {
        background: #e9ecef;
        color: #000;
        padding: 10px 15px;
        border-radius: 15px;
        display: inline-block;
        max-width: 80%;
      }
      .user-message {
        background: #0d6efd;
        color: white;
        padding: 10px 15px;
        border-radius: 15px;
        display: inline-block;
        max-width: 80%;
        float: right;
      }
      .chat-footer {
        border-top: 1px solid #dee2e6;
        padding: 10px;
        background: #fff;
      }
      .chat-footer input {
        border-radius: 20px;
      }
      .chat-footer button {
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        🤖 Rasa Assistant
      </div>
      <div id="chatBody" class="chat-body"></div>
      <div class="chat-footer input-group">
        <input id="userInput" type="text" class="form-control" placeholder="Type a message...">
        <button id="sendBtn" class="btn btn-primary">Send</button>
      </div>
    </div>

    <script>
      const rasaUrl = "http://localhost:5005/webhooks/rest/webhook"; // change this to your Rasa URL

      const chatBody = document.getElementById("chatBody");
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");

      function appendMessage(text, sender) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("chat-message");

        const bubble = document.createElement("div");
        bubble.classList.add(sender === "user" ? "user-message" : "bot-message");
        bubble.textContent = text;

        messageDiv.appendChild(bubble);
        chatBody.appendChild(messageDiv);
        chatBody.scrollTop = chatBody.scrollHeight; // scroll to bottom
      }

      async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        input.value = "";

        try {
          const response = await fetch(rasaUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender: "web_user", message })
          });
          const data = await response.json();
          if (Array.isArray(data)) {
            data.forEach((msg) => {
              if (msg.text) appendMessage(msg.text, "bot");
              if (msg.image) appendMessage("[Image] " + msg.image, "bot");
            });
          } else {
            appendMessage("No response from bot 🤔", "bot");
          }
        } catch (error) {
          appendMessage("⚠️ Error: " + error.message, "bot");
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
